{% extends "base.html" %}
{% block nav-chat %}active{% endblock %}
{% block title %}删除确认{% endblock %}

{% block topbar %}
<div class="topbar">
    <div class="breadcrumb">
        <a href="{% url 'chat:session_list' %}">对话</a><span class="sep">/</span><span class="current">删除确认</span>
    </div>
</div>
{% endblock %}

{% block content %}
<div class="confirm-delete">
    <h2>⚠️ 确认删除</h2>
    <p>确定要删除对话「<strong>{{ session.title }}</strong>」及其所有消息吗？</p>
    <div class="btn-row">
        <form method="post" style="display:inline;">{% csrf_token %}<button type="submit">确认删除</button></form>
        <a href="{% url 'chat:session_list' %}">取消</a>
    </div>
</div>
{% endblock %}
