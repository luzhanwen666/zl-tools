{% extends "base.html" %}
{% block nav-mcp %}active{% endblock %}
{% block title %}删除确认{% endblock %}

{% block topbar %}
<div class="topbar">
    <div class="breadcrumb">
        <a href="{% url 'mcp_tools:list' %}">MCP工具</a><span class="sep">/</span><span class="current">删除确认</span>
    </div>
</div>
{% endblock %}

{% block content %}
<div class="confirm-delete">
    <h2>⚠️ 确认删除</h2>
    <p>确定要删除MCP工具「<strong>{{ tool.name }}</strong>」吗？</p>
    <div class="btn-row">
        <form method="post" style="display:inline;">{% csrf_token %}<button type="submit">确认删除</button></form>
        <a href="{% url 'mcp_tools:list' %}">取消</a>
    </div>
</div>
{% endblock %}
